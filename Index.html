<!DOCTYPE html>
<html lang="id">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <title>Dashboard Divisi Usaha Syariah</title>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons & Chart.js (versi dikunci agar tampilan stabil) -->
  <script src="https://unpkg.com/lucide@0.344.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>

  <?!= include('css'); ?>
</head>
<body>
  <!-- Logika inti (konfigurasi, state, helper) dimuat lebih dulu agar halaman dapat mendaftar ke PAGES -->
  <?!= include('app'); ?>

  <!-- ================= TAMPILAN LOGIN ================= -->
  <?!= include('login'); ?>

  <!-- ================= TAMPILAN UTAMA DASHBOARD ================= -->
  <div id="dashboard-page">
    <div class="app-layout">

      <!-- SIDEBAR -->
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="brand-wrapper">
            <div class="brand-icon"><i data-lucide="landmark" style="width: 20px; height: 20px; color: #fff;"></i></div>
            <div class="brand-text"><h2>Unit Usaha<br>Syariah</h2></div>
          </div>
          <button class="btn-collapse" onclick="toggleSidebar()" title="Sembunyikan / Tampilkan Menu"><i data-lucide="chevron-left"></i></button>
        </div>
        <div class="menu-caption">Menu Navigasi</div>
        <div class="nav-scroll"><ul class="nav-list" id="sidebarMenuContainer"></ul></div>
      </aside>

      <!-- AREA UTAMA -->
      <main class="main-area">
        <header class="topbar">
          <div class="topbar-left">
            <button class="btn-toggle-top" onclick="toggleSidebar()"><i data-lucide="panel-left" style="width: 19px; height: 19px;"></i></button>
            <div class="topbar-titles">
              <h1>DASHBOARD DIVISI USAHA SYARIAH</h1>
              <div class="breadcrumb-row">
                <p id="breadcrumb">HIGHLIGHT KINERJA / RINGKASAN EKSEKUTIF</p>
                <span class="sync-status-badge" id="syncBadge">Memuat Spreadsheet...</span>
              </div>
            </div>
          </div>
          <div class="topbar-right">
            <button class="btn-sync" id="btnSync" onclick="sinkronkanDataSheet()">
              <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i><span>Sinkronkan Data</span>
            </button>
            <div class="session-timer"><i data-lucide="clock" style="width: 14px; height: 14px;"></i><span>Sisa sesi <strong id="timer">60:00</strong></span></div>
            <div class="user-badge"><div class="user-avatar" id="userInisial">D</div><div class="user-details"><div class="name" id="userName">DIVISI USAHA SYARIAH</div><div class="role" id="userRole">User</div></div></div>
            <button class="btn-logout" onclick="prosesLogout()"><i data-lucide="log-out" style="width: 14px; height: 14px;"></i><span>Keluar</span></button>
          </div>
        </header>

        <!-- 4 FILTER UTAMA (berlaku untuk semua halaman) -->
        <div class="filter-grid-4">
          <div class="filter-card"><label for="filterTanggal"><i data-lucide="calendar" style="width:13px;height:13px;"></i> Tanggal Data</label><select id="filterTanggal" onchange="terapkanFilter()"></select></div>
          <div class="filter-card"><label for="filterSeries"><i data-lucide="layers" style="width:13px;height:13px;"></i> Series Data</label><select id="filterSeries" onchange="terapkanFilter()"><option value="Bulanan" selected>Bulanan</option><option value="Triwulanan">Triwulanan</option><option value="Tahunan">Tahunan</option></select></div>
          <div class="filter-card"><label for="filterKonsolidasi"><i data-lucide="building-2" style="width:13px;height:13px;"></i> Konsolidasi Cabang</label><select id="filterKonsolidasi" onchange="onKonsolidasiChange()"><option value="Unit Usaha Syariah">Unit Usaha Syariah</option><option value="KCS Banjarmasin Konsolidasi">Konsolidasi KCS Banjarmasin</option><option value="KCS Kandangan Konsolidasi">Konsolidasi KCS Kandangan</option><option value="UUS KP">UUS KP</option></select></div>
          <div class="filter-card"><label for="filterUnitKerja"><i data-lucide="map-pin" style="width:13px;height:13px;"></i> Unit Kerja</label><select id="filterUnitKerja" onchange="terapkanFilter()"></select></div>
        </div>

        <!-- ================= HALAMAN ================= -->
        <?!= include('home'); ?>
        <?!= include('hlaset'); ?>
        <?!= include('hldpk'); ?>
        <?!= include('hlpembiayaan'); ?>
        <?!= include('aset'); ?>

      </main>
    </div>
  </div>

  <script>
    if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>
</body>
</html>
