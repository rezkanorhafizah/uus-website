<!-- ================= FILE: fbi.html — Aset & Laba / Pendapatan Fee Based Income =================
     Sumber data: sheet "FBI 1".
     Layout: 5 KPI • Trend • Realisasi terhadap Target • Leaderboard Unit Kerja • Tabel Realisasi. -->
<style>
  /* Warna aksen halaman (tag judul, ikon judul kartu) */
  #page-fbi { --accent: #0a7340; }
</style>

<div id="page-fbi" class="page">
  <div class="page-head">
    <div class="page-head-left">
      <span class="page-tag">ASET & LABA: PENDAPATAN FEE BASED INCOME</span>
      <span class="page-sub-info" id="fbi-info">-</span>
    </div>
    <button class="btn-back-highlight" onclick="bukaHalamanHighlight()">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i><span>Kembali ke Ringkasan</span>
    </button>
  </div>

  <!-- KPI -->
  <div class="kpi-grid-5" data-kpi="fbi" data-label="Nom Fee Based Income" data-icon="receipt" data-theme="bg-main"></div>

  <!-- TREND -->
  <div class="chart-card">
    <div class="chart-card-header">
      <h3><i data-lucide="line-chart" style="width:18px;height:18px;color:var(--accent);"></i><span>Trend Fee Based Income</span></h3>
      <span class="chart-badge" id="fbi-badge-trend">-</span>
    </div>
    <div class="canvas-line-wrap"><canvas id="fbi-trend"></canvas></div>
  </div>

  <!-- REALISASI & LEADERBOARD -->
  <div class="middle-charts-grid">
    <div class="chart-card">
      <div class="chart-card-header">
        <h3><i data-lucide="bar-chart-3" style="width:18px;height:18px;color:var(--accent);"></i><span>Realisasi terhadap Target Fee Based Income</span></h3>
        <span class="chart-badge" id="fbi-badge-target">-</span>
      </div>
      <div class="canvas-mid-wrap"><canvas id="fbi-target"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-header">
        <h3><i data-lucide="award" style="width:18px;height:18px;color:var(--accent);"></i><span>Leaderboard Realisasi Unit Kerja</span></h3>
      </div>
      <div class="canvas-mid-wrap"><canvas id="fbi-leader"></canvas></div>
    </div>
  </div>

  <!-- TABEL -->
  <div class="table-card">
    <div class="chart-card-header">
      <h3><i data-lucide="table" style="width:18px;height:18px;color:var(--accent);"></i><span>Tabel Realisasi Fee Based Income per Konsolidasi / per Unit Kerja</span></h3>
      <span class="chart-badge" id="fbi-badge-table">-</span>
    </div>
    <div class="table-responsive">
      <table class="realisasi-table">
        <thead><tr><th>No</th><th>Unit Kerja</th><th class="num-col">Data Aktual</th><th class="num-col">Target RBB/C</th><th class="num-col">YoY</th><th class="num-col">Ytd</th><th class="num-col">Mtm</th><th class="num-col">% RBB/C</th></tr></thead>
        <tbody id="fbi-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  PAGES.fbi = halamanIndikator({ page: 'fbi', metric: 'Fee Based Income', sheet: 'FBI 1', fmt: 'rp', warna: WARNA.hijau });
</script>
