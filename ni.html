<!-- ================= FILE: ni.html — Rasio / NI =================
     Sumber data: sheet "NI 1".
     Layout: 5 KPI • Trend • Realisasi terhadap Target • Leaderboard Unit Kerja • Tabel Realisasi. -->
<style>
  /* Warna aksen halaman (tag judul, ikon judul kartu) */
  #page-ni { --accent: #1d4ed8; }
</style>

<div id="page-ni" class="page">
  <div class="page-head">
    <div class="page-head-left">
      <span class="page-tag">RASIO: NI</span>
      <span class="page-sub-info" id="ni-info">-</span>
    </div>
    <button class="btn-back-highlight" onclick="bukaHalamanHighlight()">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i><span>Kembali ke Ringkasan</span>
    </button>
  </div>

  <!-- KPI -->
  <div class="kpi-grid-5" data-kpi="ni" data-label="NI" data-icon="percent" data-theme="bg-main"></div>

  <!-- TREND -->
  <div class="chart-card">
    <div class="chart-card-header">
      <h3><i data-lucide="line-chart" style="width:18px;height:18px;color:var(--accent);"></i><span>Trend NI</span></h3>
      <span class="chart-badge" id="ni-badge-trend">-</span>
    </div>
    <div class="canvas-line-wrap"><canvas id="ni-trend"></canvas></div>
  </div>

  <!-- REALISASI & LEADERBOARD -->
  <div class="middle-charts-grid">
    <div class="chart-card">
      <div class="chart-card-header">
        <h3><i data-lucide="bar-chart-3" style="width:18px;height:18px;color:var(--accent);"></i><span>Realisasi terhadap Target NI</span></h3>
        <span class="chart-badge" id="ni-badge-target">-</span>
      </div>
      <div class="canvas-mid-wrap"><canvas id="ni-target"></canvas></div>
    </div>
    <div class="chart-card">
      <div class="chart-card-header">
        <h3><i data-lucide="award" style="width:18px;height:18px;color:var(--accent);"></i><span>Leaderboard Realisasi Unit Kerja</span></h3>
      </div>
      <div class="canvas-mid-wrap"><canvas id="ni-leader"></canvas></div>
    </div>
  </div>

  <!-- TABEL -->
  <div class="table-card">
    <div class="chart-card-header">
      <h3><i data-lucide="table" style="width:18px;height:18px;color:var(--accent);"></i><span>Tabel Realisasi NI per Konsolidasi / per Unit Kerja</span></h3>
      <span class="chart-badge" id="ni-badge-table">-</span>
    </div>
    <div class="table-responsive">
      <table class="realisasi-table">
        <thead><tr><th>No</th><th>Unit Kerja</th><th class="num-col">Data Aktual</th><th class="num-col">Target RBB/C</th><th class="num-col">YoY</th><th class="num-col">Ytd</th><th class="num-col">Mtm</th><th class="num-col">% RBB/C</th></tr></thead>
        <tbody id="ni-table"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
  PAGES.ni = halamanIndikator({ page: 'ni', metric: 'NI', sheet: 'NI 1', fmt: 'pct', warna: WARNA.biru });
</script>
