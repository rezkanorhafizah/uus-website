<!-- ================= FILE: login.html — Halaman Login ================= -->
<style>
  #login-page {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    width: 100vw;
    background-color: #e3f3e8;
  }

  .login-card {
    background-color: var(--bg-card-login);
    padding: 45px 40px;
    border-radius: 20px;
    width: 100%;
    max-width: 440px;
    box-shadow: 0 15px 35px rgba(10, 115, 64, 0.08);
  }

  .login-card h1 {
    color: var(--primary-green);
    font-size: 22px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
  }

  .login-card p.subtitle {
    color: #4b6a59;
    font-size: 13px;
    margin-bottom: 28px;
  }

  .form-group {
    margin-bottom: 18px;
  }

  .form-group label {
    display: block;
    color: #1b5236;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
  }

  .form-group input {
    width: 100%;
    padding: 13px 16px;
    border: 1px solid #d1e2d7;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
    background: #ffffff;
  }

  .form-group input:focus {
    border-color: var(--primary-green);
  }

  .btn-login {
    width: 100%;
    padding: 13px;
    background-color: var(--primary-green);
    color: #ffffff;
    border: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 10px;
    transition: background 0.2s;
  }

  .btn-login:hover {
    background-color: var(--primary-green-hover);
  }

  .error-msg {
    color: #dc2626;
    font-size: 12px;
    margin-top: 10px;
    text-align: center;
    display: none;
  }
</style>

<div id="login-page">
  <form class="login-card" onsubmit="prosesLogin(); return false;">
    <h1>DASHBOARD DIVISI USAHA<br>SYARIAH</h1>
    <p class="subtitle">Silakan masuk untuk melanjutkan..</p>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Masukkan username" autocomplete="username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Masukkan password" autocomplete="current-password">
    </div>
    <button type="submit" class="btn-login" id="btnLogin">Masuk</button>
    <div class="error-msg" id="loginError">Username atau password salah!</div>
  </form>
</div>

<script>
  function prosesLogin() {
    const user = document.getElementById('username').value.trim();
    const pass = document.getElementById('password').value;
    const btn = document.getElementById('btnLogin');
    const err = document.getElementById('loginError');

    function selesai() {
      btn.textContent = 'Masuk';
      btn.disabled = false;
    }
    function tampilkanError(pesan) {
      err.textContent = pesan;
      err.style.display = 'block';
    }

    if (!user || !pass) {
      tampilkanError('Username dan password wajib diisi.');
      return;
    }

    btn.textContent = 'Memeriksa...';
    btn.disabled = true;
    err.style.display = 'none';

    if (typeof google === 'undefined' || !google.script) {
      selesai();
      tampilkanError('Dashboard harus dibuka melalui URL Web App Google Apps Script.');
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        selesai();
        if (res && res.success) {
          bukaDashboard(res);
        } else {
          tampilkanError((res && res.message) || 'Username atau password salah!');
        }
      })
      .withFailureHandler(function(e) {
        selesai();
        tampilkanError('Gagal menghubungi server: ' + (e && e.message ? e.message : e));
      })
      .checkLogin(user, pass);
  }
</script>
